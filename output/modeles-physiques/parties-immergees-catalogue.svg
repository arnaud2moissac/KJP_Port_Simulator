<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1188" viewBox="0 0 1680 1188" role="img"><title>PARTIES IMMERGÉES | Sections et écoulements locaux</title><rect width="1680" height="1188" fill="#fff"/><text x="36" y="49" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="600" text-anchor="start">PARTIES IMMERGÉES | Sections et écoulements locaux</text><text x="36" y="81" fill="#596c7d" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Répartition exacte du cross-flow ; distinction entre aires résistantes, masse ajoutée et géométrie de présentation.</text><polyline points="36,102 1644,102" fill="none" stroke="#192f45" stroke-width="1.8"/><polygon points="36,121 1644,121 1644,158 36,158" fill="#f5f8fa" fill-opacity="1" stroke="none" stroke-width="1"/><text x="46" y="147" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">Section</text><text x="151" y="147" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">x (m)</text><text x="326" y="147" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">Δx (m)</text><text x="508" y="147" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">shape</text><text x="726" y="147" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">Profondeur (m)</text><text x="998" y="147" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">A efficace (m²)</text><text x="1268" y="147" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">h efficace (m)</text><polygon points="36,166 1644,166 1644,197 36,197" fill="#f8fafb" fill-opacity="1" stroke="none" stroke