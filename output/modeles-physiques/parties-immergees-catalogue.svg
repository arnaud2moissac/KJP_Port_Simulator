y="411" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">0,86</text><text x="726" y="411" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">0,628592</text><text x="998" y="411" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">0,376654</text><text x="1268" y="411" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">0,421056</text><polygon points="36,422 1644,422 1644,453 36,453" fill="#f8fafb" fill-opacity="1" stroke="none" stroke-width="1"/><text x="46" y="443" fill="#278eaa" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">S09</text><text x="151" y="443" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">2,683636</text><text x="326" y="443" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">0,894545</text><text x="508" y="443" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">0,70</text><text x="726" y="443" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">0,569840</text><text x="998" y="443" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">0,306579</text><text x="1268" y="443" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">0,342720</text><text x="46" y="475" fill="#278eaa" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">S10</text><text x="151" y="475" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">3,578182</text><text x="326" y="475" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">0,894545</text><text x="508" y="475" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">0,48</text><text x="726" y="475" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">0,489056</text><text x="998" y="475" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">0,210225</text><text x="1268" y="475" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">0,235008</text><polygon points="36,486 1644,486 1644,517 36,517" fill="#f8fafb" fill-opacity="1" stroke="none" stroke-width="1"/><text x="46" y="507" fill="#278eaa" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">S11</text><text x="151" y="507" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">4,472727</text><text x="326" y="507" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">0,894545</text><text x="508" y="507" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">0,22</text><text x="726" y="507" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">0,393584</text><text x="998" y="507" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">0,096353</text><text x="1268" y="507" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">0,107712</text><text x="36" y="573" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">A efficace = T carène × areaFactor × Δx × shape = 0,68 × 0,72 × Δx × shape.</text><text x="36" y="603" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">h efficace = A / Δx : hauteur choisie pour dessiner le ruban, pas la profondeur de la coque.</text><text x="36" y="633" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Profondeur de section = 0,68 × (0,46 + 0,54 × shape). Le moteur l’utilise dans la masse ajoutée.</text><text x="36" y="663" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">La coque axiale est une résistance globale X(u relatif) ; les 11 efforts latéraux sont évalués séparément.</text><polyline points="36,696 1644,696" fill="none" stroke="#cfdae2" stroke-width="1"/><text x="36" y="731" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start">CENTRES ET AIRES DES ORGANES</text><text x="36" y="764" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Quille : C=(-0,18 ; 0,00 ; -1,08) m ; A=3,15 m² ; span=1,26 m.</text><text x="36" y="793" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Safran à 0° : C=(-4,35 ; 0,00 ; -1,12) m ; A=0,82 m² ; span=1,18 m.</text><text x="36" y="822" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Corde moyenne=0,695 m ; mèche à 20 % depuis le bord d’attaque, x=-4,142 m.</text><text x="36" y="851" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Hélice : C=(-3,45 ; 0,00 ; -0,70) m ; diamètre=0,406 m.</text><text x="36" y="880" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Chaque bande R1...R5 : A=0,164 m², hauteur=0,236 m ; centres z exacts ci-dessous.</text><text x="36" y="909" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">R1 : z=-1,592 m ; centre longitudinal x=-4,350 m.</text><text x="36" y="938" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">R2 : z=-1,356 m ; centre longitudinal x=-4,350 m.</text><text x="36" y="967" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">R3 : z=-1,120 m ; centre longitudinal x=-4,350 m.</text><text x="36" y="996" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">R4 : z=-0,884 m ; centre longitudinal x=-4,350 m.</text><text x="36" y="1025" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">R5 : z=-0,648 m ; centre longitudinal x=-4,350 m.</text><text x="848" y="731" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start">VITESSE DU BATEAU RELATIVE À L’EAU</text><text x="848" y="768" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">u relatif = vitesse bateau - courant, axe avant.</text><text x="848" y="797" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">v relatif = vitesse bateau - courant, axe tribord.</text><text x="848" y="826" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">À un élément (x,y) :</text><text x="848" y="855" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">u local = u relatif - r × y</text><text x="848" y="884" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">v local = v relatif + r × x</text><text x="848" y="913" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Le safran ajoute le jet axial et le tourbillon</text><text x="848" y="942" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">de chaque hélice reliée, bande par bande.</text><text x="848" y="971" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Sans écoulement ni jet, il ne produit pas de force.</text><text x="36" y="1063" fill="#596c7d" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Contours quille / safran : rectangles équivalents. Le moteur fait tourner le safran autour de sa mèche fixe et intègre le jet sur corde × hauteur.</text><text x="36" y="1093" fill="#596c7d" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Le tirant d’eau nominal est 1,94 m ; il ne se confond ni avec le centre de quille z=-1,08 m, ni avec l’envergure de son modèle.</text><polyline points="36,1123 1644,1123" fill="none" stroke="#cfdae2" stroke-width="1"/><text x="36" y="1147" fill="#596c7d" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">KJP | Sun Odyssey 36i | profil 6.0.1 | moteur 6.0.0 | 04.10.2026</text><text x="36" y="1169" fill="#596c7d" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">Origine : x=0 du moteur, axe du bateau et flottaison. Les coordonnées et aires de calcul sont reprises du profil versionné.</text><text x="1644" y="1147" fill="#596c7d" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="end">02 / 02</text></svg>