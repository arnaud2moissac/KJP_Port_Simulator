font-size="16" font-weight="400" text-anchor="start">0,249696</text><polygon points="36,230 1644,230 1644,261 36,261" fill="#f8fafb" fill-opacity="1" stroke="none" stroke-width="1"/><text x="46" y="251" fill="#278eaa" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">S03</text><text x="151" y="251" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">-2,683636</text><text x="326" y="251" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">0,894545</text><text x="508" y="251" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">0,73</text><text x="726" y="251" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">0,580856</text><text x="998" y="251" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">0,319718</text><text x="1268" y="251" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">0,357408</text><text x="46" y="283" fill="#278eaa" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">S04</text><text x="151" y="283" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">-1,789091</text><text x="326" y="283" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">0,894545</text><text x="508" y="283" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">0,88</text><text x="726" y="283" fill="#192f45" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">0,635936</text><text x="998" y="283" fill="#192f45" font-family="DejaVu Sa